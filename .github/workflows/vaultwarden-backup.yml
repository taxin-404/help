name: Vaultwarden Offsite Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client & AWS CLI v2
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Dump Aiven PostgreSQL DB
        env:
          AIVEN_PG_URI: ${{ secrets.AIVEN_DATABASE_URL }}
        run: |
          mkdir -p backup_dir
          pg_dump "$AIVEN_PG_URI" -F c -b -v -f backup_dir/vaultwarden_aiven_$(date +%Y%m%d_%H%M%S).dump

      - name: Upload Dump to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws s3 sync backup_dir/ s3://$BUCKET_NAME/vaultwarden-backups/ \
            --endpoint-url $ENDPOINT_URL \
            --region auto
